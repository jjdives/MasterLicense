<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NMC Practice Exams | Master License Study Hub</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0b1422;color:#eaf2ff}*{box-sizing:border-box}body{margin:0}a{color:#7dd3fc}header{background:#15263d;padding:16px 5%;border-bottom:1px solid #33455e}main{max-width:1060px;margin:0 auto;padding:24px 18px 60px}h1,h2{line-height:1.2}h1{margin:4px 0;font-size:1.75rem}.muted{color:#9eb0c6}.panel{background:#16263a;border:1px solid #35465e;border-radius:12px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.choice{display:block;width:100%;text-align:left;background:#23364e;color:white;border:1px solid #52637b;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer;font:inherit}.choice[aria-pressed=true]{border:2px solid #7dd3fc;background:#1b465d}.choice:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #fbbf24}button,.btn{cursor:pointer;background:#0284c7;color:#fff;font:inherit;border:0;border-radius:8px;padding:10px 15px;font-weight:650;margin:4px 5px 4px 0}button[disabled]{opacity:.4;cursor:not-allowed}button.secondary{background:#40536b}.tag{border:1px solid #68839b;border-radius:16px;padding:3px 9px;font-size:.8rem}.correct{border-left:4px solid #4ade80;padding:12px;background:#12382f}.incorrect{border-left:4px solid #fb7185;padding:12px;background:#40232e}label{display:block;margin:12px 0}select,input[type=checkbox]{margin-right:8px}select{background:#253a53;color:white;border:1px solid #63809a;padding:9px;border-radius:8px;font:inherit}#question{font-size:1.16rem;line-height:1.5}#explanation{line-height:1.6;margin-top:14px}#summary li{margin:8px 0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}small{color:#aabbd0}@media(max-width:600px){header{padding:14px 18px}main{padding:14px}h1{font-size:1.45rem}.panel{padding:15px}}
</style></head><body>
<header><div class="top"><div><a href="../index.html">← Study Hub</a><h1>NMC Practice Exams</h1><small>Independent study questions • USCG regulations • Browser-only progress</small></div><a href="https://www.dco.uscg.mil/nmc/examinations/" target="_blank" rel="noopener">NMC examination outlines</a></div></header>
<main><div id="setup" class="panel"><h2>Choose an examination module</h2><p class="muted">Available banks are marked as beta while we expand toward 150–200% coverage. This is not an official Coast Guard exam.</p><div id="modules" class="grid"></div><label>Feedback mode <select id="mode"><option value="study">Study: explain after each answer</option><option value="exam">Exam: explain after submission</option></select></label><label><input type="checkbox" id="timed">Timed (practice timer)</label><label><input type="checkbox" id="missed">Only previously missed questions (this browser)</label><button id="start">Start practice</button><p id="error" role="alert" class="muted"></p></div>
<div id="test" hidden><div class="panel"><div class="top"><strong id="progress"></strong><span id="clock" aria-live="off"></span></div><p id="question"></p><div id="options" role="group" aria-label="Choose one answer"></div><div id="explanation" aria-live="polite"></div><div class="top"><div><button class="secondary" id="previous">Previous</button><button id="next">Next</button></div><button id="submit" class="secondary">Submit exam</button></div></div></div>
<div id="results" class="panel" hidden><h2>Exam results</h2><div id="score"></div><div id="summary"></div><button id="again">New exam</button><button id="retry" class="secondary">Retest missed questions</button></div></main>
<script type="module">
const $=id=>document.getElementById(id);
const key='nmc-study-v1';
const saved=()=>{try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}};
const store=x=>localStorage.setItem(key,JSON.stringify(x));
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let catalog=[],bank=[],module=null,items=[],answers={},index=0,mode='study',timer=null,remaining=0,ended=false;
fetch('./data/modules.json').then(r=>{if(!r.ok)throw Error('Catalog unavailable');return r.json()}).then(data=>{catalog=data.modules;const box=$('modules');catalog.forEach(m=>{const label=document.createElement('label');label.className='panel';label.style.margin='0';label.innerHTML='<input type="radio" name="module" value="'+m.id+'" '+(m.id==='q100'?'checked':'')+' '+(m.bank?'':'disabled')+'><strong>'+m.code+'</strong> '+m.title+'<br><small>'+m.count+' exam questions · '+m.pass+'% passing · '+(m.bank?'Beta bank':'Coming soon')+'</small>';box.append(label)})}).catch(e=>$('error').textContent=e.message);
const valid=q=>q?.id&&q?.stem&&Array.isArray(q.options)&&q.options.length===4&&new Set(q.options.map(o=>o.id)).size===4&&q.options.some(o=>o.id===q.correctOptionId)&&q.explanation;
$('start').onclick=async()=>{const selected=document.querySelector('input[name=module]:checked');if(!selected)return;module=catalog.find(m=>m.id===selected.value);if(!module?.bank)return;$('error').textContent='';try{const response=await fetch('./data/'+module.bank);if(!response.ok)throw Error('Question bank unavailable');bank=await response.json();if(!bank.every(valid)||new Set(bank.map(q=>q.id)).size!==bank.length)throw Error('Invalid question bank: contact maintainer');let pool=bank;if($('missed').checked){const missed=new Set(saved().missed?.[module.id]||[]);pool=bank.filter(q=>missed.has(q.id));if(!pool.length){$('error').textContent='No missed questions saved for this module.';return}}items=shuffle(pool).slice(0,module.count).map(q=>({...q,shown:shuffle(q.options)}));answers={};index=0;ended=false;mode=$('mode').value;remaining=module.minutes*60;$('setup').hidden=true;$('results').hidden=true;$('test').hidden=false;if(timer)clearInterval(timer);if($('timed').checked){timer=setInterval(()=>{remaining--;showClock();if(remaining<=0)finish()},1000)}else $('clock').textContent='Untimed';render()}catch(e){$('error').textContent=e.message}};
function showClock(){const n=Math.max(0,remaining);$('clock').textContent='Time: '+Math.floor(n/3600)+':'+String(Math.floor(n/60)%60).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function render(){let q=items[index];$('progress').textContent=module.code+' · Question '+(index+1)+' of '+items.length;$('question').textContent=q.stem;$('options').replaceChildren();q.shown.forEach((o,j)=>{const b=document.createElement('button');b.className='choice';b.textContent=String.fromCharCode(65+j)+'. '+o.text;b.setAttribute('aria-pressed',String(answers[q.id]===o.id));b.onclick=()=>{answers[q.id]=o.id;render()};$('options').append(b)});$('explanation').replaceChildren();if(mode==='study'&&answers[q.id]){const c=answers[q.id]===q.correctOptionId;const el=document.createElement('div');el.className=c?'correct':'incorrect';const right=q.options.find(o=>o.id===q.correctOptionId);const strong=document.createElement('strong');strong.textContent=c?'Correct':'Incorrect · Correct answer: '+right.text;el.append(strong);const p=document.createElement('p');p.textContent=q.explanation;el.append(p);const a=document.createElement('a');a.href=q.source?.url||'#';a.target='_blank';a.rel='noopener';a.textContent=q.source?.label||'Source';el.append(a);$('explanation').append(el)}$('previous').disabled=index===0;$('next').disabled=index===items.length-1}
$('previous').onclick=()=>{index--;render()};$('next').onclick=()=>{index++;render()};$('submit').onclick=()=>{if(confirm('Submit and grade your answers?'))finish()};
function finish(){if(ended)return;ended=true;if(timer){clearInterval(timer);timer=null}const stats=saved();stats.missed??={};const missed=items.filter(q=>answers[q.id]!==q.correctOptionId).map(q=>q.id);stats.missed[module.id]=missed;stats.last??={};const count=items.length-missed.length;stats.last[module.id]={score:count,total:items.length,at:new Date().toISOString()};store(stats);$('test').hidden=true;$('results').hidden=false;$('score').textContent=count+'/'+items.length+' correct ('+Math.round(100*count/items.length)+'%). '+(count/items.length*100>=module.pass?'At or above practice passing threshold.':'Below practice passing threshold.');$('summary').replaceChildren();const ol=document.createElement('ol');items.forEach(q=>{const li=document.createElement('li');const c=answers[q.id]===q.correctOptionId;const your=q.options.find(o=>o.id===answers[q.id]);const right=q.options.find(o=>o.id===q.correctOptionId);const b=document.createElement('strong');b.textContent=(c?'✓ ':'✗ ')+q.stem;li.append(b);const p=document.createElement('p');p.textContent='Your answer: '+(your?.text||'Not answered')+' | Correct: '+right.text+'. '+q.explanation;li.append(p);ol.append(li)});$('summary').append(ol);$('retry').disabled=!missed.length}
$('again').onclick=()=>{if(timer)clearInterval(timer);$('results').hidden=true;$('setup').hidden=false;$('missed').checked=false};$('retry').onclick=()=>{if(timer)clearInterval(timer);$('results').hidden=true;$('setup').hidden=false;$('missed').checked=true};
</script></body></html>
