<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Navigation Lights Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Three.js and OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; margin: 0; padding: 0; background-color: #020617; touch-action: none; }
        #canvas-container { width: 100%; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; }
        
        button { text-align: left; transition: all 0.2s; border: 1px solid transparent; }
        button:hover { background-color: #1e293b; border-color: #38bdf8; }
        button.active { background-color: #0ea5e9; color: white; border-color: #bae6fd; font-weight: bold; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        @media (min-width: 768px) {
            #ui-layer { justify-content: flex-start; flex-direction: row; }
        }
    </style>
</head>
<body>

    <!-- 3D Canvas Background -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <!-- Sidebar (Bottom Drawer on Mobile, Left Sidebar on Desktop) -->
        <div class="w-full md:w-[320px] h-[45vh] md:h-screen bg-slate-900/85 backdrop-blur-md border-t md:border-t-0 md:border-r border-slate-700 p-4 md:p-6 flex flex-col gap-3 text-slate-200 shadow-2xl overflow-y-auto pointer-events-auto">
            <h1 class="text-xl md:text-2xl font-extrabold text-sky-400 border-b border-slate-600 pb-3 mb-1">3D Nav Lights</h1>
            
            <p class="text-xs text-slate-400 leading-relaxed hidden md:block">
                Left-Click & Drag to orbit.<br>Scroll to zoom in/out.
            </p>
            <p class="text-xs text-slate-400 leading-relaxed md:hidden">
                Swipe to orbit. Pinch to zoom.
            </p>

            <h2 class="text-xs md:text-sm font-bold text-slate-500 uppercase tracking-wider mt-2 md:mt-4">Select Scenario</h2>
            
            <div id="btn-group" class="flex flex-col gap-2">
                <!-- Buttons will be populated by JS -->
            </div>
            
            <div id="scenario-description" class="mt-auto pt-4 md:pt-6 border-t border-slate-600 text-sm text-sky-200">
                <!-- Description populated by JS -->
            </div>
        </div>
        
        <!-- Helpful HUD (Moved to top right so it doesn't block mobile UI) -->
        <div class="absolute top-4 right-4 text-slate-400 text-[10px] md:text-xs bg-slate-900/60 px-3 py-1.5 md:px-4 md:py-2 rounded-full pointer-events-none border border-slate-700 backdrop-blur-md">
            Bow is Fwd • Green is Stbd • Red is Port
        </div>
    </div>

    <script>
        // --- THREE.JS SETUP ---
        let scene, camera, renderer, controls, boatGroup, lightsGroup;
        
        // Colors
        const C_WHITE = 0xffffff;
        const C_RED = 0xff1111;
        const C_GREEN = 0x11ff11;
        const C_YELLOW = 0xffdd00;

        function init3D() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617); // Slate 950 (Night sky)
            scene.fog = new THREE.FogExp2(0x020617, 0.015);

            // Camera Setup: Slightly above and forward of starboard bow
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // Adjust camera distance for mobile vs desktop
            if (window.innerWidth < 768) {
                camera.position.set(35, 20, 40); // Zoomed out more for mobile to account for bottom panel
            } else {
                camera.position.set(25, 15, 30);
            }

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Orbit Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            
            // Shift target slightly up so the boat isn't hidden by the mobile menu
            if (window.innerWidth < 768) {
                controls.target.set(0, 8, 0); 
            } else {
                controls.target.set(0, 2, 0);
            }

            // Environmental Lighting (Moonlight/Ambient)
            const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
            scene.add(ambientLight);
            
            const moonLight = new THREE.DirectionalLight(0x94a3b8, 0.5);
            moonLight.position.set(10, 20, 10);
            scene.add(moonLight);

            // Ocean Plane (Made matte to remove specular light artifacts)
            const oceanGeo = new THREE.PlaneGeometry(200, 200);
            const oceanMat = new THREE.MeshStandardMaterial({ 
                color: 0x0f172a, 
                roughness: 0.9, 
                metalness: 0.1,
                transparent: true,
                opacity: 0.8
            });
            const ocean = new THREE.Mesh(oceanGeo, oceanMat);
            ocean.rotation.x = -Math.PI / 2;
            ocean.position.y = -0.5;
            scene.add(ocean);

            buildBoat();

            // Group to hold all active navigation lights
            lightsGroup = new THREE.Group();
            scene.add(lightsGroup);

            // Handle Resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function buildBoat() {
            boatGroup = new THREE.Group();
            
            const matHull = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.7 });
            const matDeck = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.9 });
            const matCabin = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
            const matMast = new THREE.MeshStandardMaterial({ color: 0xcbd5e1, roughness: 0.4 });

            // 1. Hull (Extruded Shape)
            const hullShape = new THREE.Shape();
            hullShape.moveTo(0, 12); // Bow
            hullShape.lineTo(4, 6);  // Stbd Bow Curve
            hullShape.lineTo(4, -10); // Stbd Stern
            hullShape.lineTo(-4, -10); // Port Stern
            hullShape.lineTo(-4, 6);  // Port Bow Curve
            hullShape.lineTo(0, 12); // Back to Bow

            const extrudeSettings = {
                depth: 3,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.5,
                bevelThickness: 1
            };

            const hullGeo = new THREE.ExtrudeGeometry(hullShape, extrudeSettings);
            const hull = new THREE.Mesh(hullGeo, matHull);
            // Rotate shape to lie flat
            hull.rotation.x = Math.PI / 2;
            hull.position.y = 3;
            boatGroup.add(hull);

            // 2. Main Deck Cabin
            const cabinGeo = new THREE.BoxGeometry(6, 3, 8);
            const cabin = new THREE.Mesh(cabinGeo, matCabin);
            cabin.position.set(0, 4.5, -2);
            boatGroup.add(cabin);

            // 3. Wheelhouse (Upper Cabin)
            const wheelGeo = new THREE.BoxGeometry(4, 2.5, 4);
            const wheelhouse = new THREE.Mesh(wheelGeo, matCabin);
            wheelhouse.position.set(0, 7.25, -1);
            boatGroup.add(wheelhouse);

            // 4. Forward Mast
            const fwdMastGeo = new THREE.CylinderGeometry(0.15, 0.15, 8);
            const fwdMast = new THREE.Mesh(fwdMastGeo, matMast);
            fwdMast.position.set(0, 8, 4);
            boatGroup.add(fwdMast);

            // 5. Aft Mast
            const aftMastGeo = new THREE.CylinderGeometry(0.15, 0.15, 12);
            const aftMast = new THREE.Mesh(aftMastGeo, matMast);
            aftMast.position.set(0, 10, -4);
            boatGroup.add(aftMast);

            scene.add(boatGroup);
        }

        // --- NAVIGATION LIGHT GENERATOR ---
        function createNavLight(colorHex, x, y, z) {
            const lightGroup = new THREE.Group();
            lightGroup.position.set(x, y, z);

            // The visible bulb
            const bulbGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const bulbMat = new THREE.MeshBasicMaterial({ color: colorHex });
            const bulb = new THREE.Mesh(bulbGeo, bulbMat);
            lightGroup.add(bulb);

            // The glowing halo (Increased size/opacity, set depthWrite to false to prevent clipping)
            const haloGeo = new THREE.SphereGeometry(1.2, 16, 16);
            const haloMat = new THREE.MeshBasicMaterial({ 
                color: colorHex, 
                transparent: true, 
                opacity: 0.5,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            lightGroup.add(halo);

            // NOTE: Removed the THREE.PointLight to fix the distracting reflections on the water/hull.
            // The MeshBasicMaterial with AdditiveBlending handles the glow beautifully on its own.

            lightsGroup.add(lightGroup);
        }

        // --- SCENARIOS ---
        const scenarios = {
            'power_under_50': {
                name: 'Power-Driven < 50m',
                desc: '1 Masthead (Fwd), Sidelights, Sternlight.',
                setup: () => {
                    createNavLight(C_WHITE, 0, 12.2, 4); // Fwd Masthead
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd Sidelight
                    createNavLight(C_RED, -4.2, 5, 2);   // Port Sidelight
                    createNavLight(C_WHITE, 0, 4, -10.2); // Sternlight
                }
            },
            'power_over_50': {
                name: 'Power-Driven > 50m',
                desc: '2 Mastheads (Aft is higher), Sidelights, Sternlight.',
                setup: () => {
                    createNavLight(C_WHITE, 0, 12.2, 4); // Fwd Masthead
                    createNavLight(C_WHITE, 0, 16.2, -4); // Aft Masthead
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd
                    createNavLight(C_RED, -4.2, 5, 2);   // Port
                    createNavLight(C_WHITE, 0, 4, -10.2); // Stern
                }
            },
            'sailing': {
                name: 'Sailing Vessel Underway',
                desc: 'Sidelights and Sternlight ONLY. (Optional Red over Green shown here).',
                setup: () => {
                    // Optional Red over Green at mast top
                    createNavLight(C_RED, 0, 16.2, -4); 
                    createNavLight(C_GREEN, 0, 14.5, -4);
                    // Standard
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd
                    createNavLight(C_RED, -4.2, 5, 2);   // Port
                    createNavLight(C_WHITE, 0, 4, -10.2); // Stern
                }
            },
            'towing_astern': {
                name: 'Towing Astern (< 200m)',
                desc: 'Yellow over White at the stern, 2 Mastheads, Sidelights.',
                setup: () => {
                    createNavLight(C_WHITE, 0, 12.2, 4); // Mast 1
                    createNavLight(C_WHITE, 0, 10.5, 4); // Mast 2
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd
                    createNavLight(C_RED, -4.2, 5, 2);   // Port
                    createNavLight(C_YELLOW, 0, 5.5, -10.2); // Towing Yellow
                    createNavLight(C_WHITE, 0, 4, -10.2); // Stern White
                }
            },
            'fishing': {
                name: 'Fishing (Lines/Nets)',
                desc: 'Red over White on mast. Sidelights/Sternlight only if making way.',
                setup: () => {
                    createNavLight(C_RED, 0, 12.2, 4); // Red
                    createNavLight(C_WHITE, 0, 10.5, 4); // White
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd
                    createNavLight(C_RED, -4.2, 5, 2);   // Port
                    createNavLight(C_WHITE, 0, 4, -10.2); // Stern
                }
            },
            'ram': {
                name: 'Restricted Maneuver (RAM)',
                desc: 'Red-White-Red vertically. Power-driven lights if making way.',
                setup: () => {
                    createNavLight(C_RED, 0, 16.2, -4); // Red
                    createNavLight(C_WHITE, 0, 14.5, -4); // White
                    createNavLight(C_RED, 0, 12.8, -4); // Red
                    
                    // Power lights (making way)
                    createNavLight(C_WHITE, 0, 12.2, 4); // Fwd Mast
                    createNavLight(C_GREEN, 4.2, 5, 2);  // Stbd
                    createNavLight(C_RED, -4.2, 5, 2);   // Port
                    createNavLight(C_WHITE, 0, 4, -10.2); // Stern
                }
            }
        };

        function setScenario(key) {
            // Update UI
            document.querySelectorAll('#btn-group button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + key).classList.add('active');
            document.getElementById('scenario-description').innerHTML = `<strong>${scenarios[key].name}</strong><br>${scenarios[key].desc}`;

            // Clear old lights
            while(lightsGroup.children.length > 0){ 
                lightsGroup.remove(lightsGroup.children[0]); 
            }

            // Setup new lights
            scenarios[key].setup();
        }

        function createUI() {
            const btnGroup = document.getElementById('btn-group');
            for (const key in scenarios) {
                const btn = document.createElement('button');
                btn.id = 'btn-' + key;
                btn.className = 'w-full px-3 py-2 md:px-4 md:py-3 rounded-lg text-xs md:text-sm bg-slate-800 text-slate-300 hover:text-white';
                btn.innerText = scenarios[key].name;
                btn.onclick = () => setScenario(key);
                btnGroup.appendChild(btn);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            
            // Adjust camera dynamically on resize
            if (window.innerWidth < 768) {
                controls.target.set(0, 8, 0); 
            } else {
                controls.target.set(0, 2, 0);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            // Subtle boat bobbing effect
            const time = Date.now() * 0.001;
            boatGroup.position.y = Math.sin(time * 1.5) * 0.2;
            boatGroup.rotation.z = Math.sin(time * 0.8) * 0.02;
            boatGroup.rotation.x = Math.sin(time * 1.1) * 0.02;
            
            // Move lights with the boat
            lightsGroup.position.copy(boatGroup.position);
            lightsGroup.rotation.copy(boatGroup.rotation);

            renderer.render(scene, camera);
        }

        // --- INIT ---
        window.onload = () => {
            init3D();
            createUI();
            setScenario('power_under_50'); // Default
            animate();
        };
    </script>
</body>
</html>
